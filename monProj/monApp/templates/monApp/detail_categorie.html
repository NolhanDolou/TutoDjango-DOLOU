{% extends 'monApp/base.html' %}
{% block contenu %}
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h4>Détail de la catégorie</h4>
    </div>
    <div class="card-body">
        <h5 class="card-title">{{ ctr.nomCat }}</h5>
        <ul class="list-unstyled">
            <li><strong>Référence :</strong> {{ ctr.idCat }}</li>
            <li><strong>Nom catégorie :</strong> {{ ctr.nomCat }}</li>
            <li><strong>Nombre de produits :</strong> {{ ctr.nb_produits }}</li>
        </ul>
    </div>
    <div class="card-footer text-center">
        <a href="{% url 'ListeCategories' %}" class="btn btn-secondary mt-2">Retour</a>
        <a href="{% url 'modificationCategorie' ctr.idCat %}" class="btn btn-warning mt-2">Modifier</a>
        <a href="{% url 'suppressionCategorie' ctr.idCat %}" class="btn btn-danger mt-2">Supprimer</a>
    </div>
</div>
{% endblock %}

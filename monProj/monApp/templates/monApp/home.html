{% extends 'monApp/base.html' %}

{% block contenu %}
{% if param %}
<h1>Hello {{ param }}!</h1>
<p>Welcome, this is the {{ page }} page </p>
{% else %} 
<h1>{{message}}</h1> 
{%endif%}
{% if form %}
<form action="" method="post" novalidate>
{% csrf_token %}
{{ form.as_p }}
<button type="submit" class="btn btn-success mt-2">Envoyer</button>
</form>
{%endif%}
{% endblock %}
